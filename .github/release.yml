changelog:
  exclude:
    labels:
      - skip-changelog
      - ignore-for-release
      - no-changelog
  categories:
    - title: "Features"
      labels:
        - feature
        - enhancement
    - title: "Bug fixes"
      labels:
        - bug
        - bugfix
    - title: "Security"
      labels:
        - security
    - title: "Maintenance"
      labels:
        - dependencies
        - maintenance
        - documentation
    - title: "Other changes"
      labels:
        - "*"
