name: Cross-platform validation and draft release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echocrypt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10", python_arch: "x64" }
          - { os: ubuntu-latest, python: "3.11", python_arch: "x64" }
          - { os: ubuntu-latest, python: "3.12", python_arch: "x64" }
          - { os: ubuntu-latest, python: "3.13", python_arch: "x64" }
          - { os: windows-latest, python: "3.11", python_arch: "x64" }
          - { os: windows-11-arm, python: "3.11", python_arch: "arm64" }
          - { os: ubuntu-24.04-arm, python: "3.11", python_arch: "arm64" }
          - { os: macos-15, python: "3.11", python_arch: "arm64" }
          - { os: macos-15-intel, python: "3.11", python_arch: "x64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python_arch }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows' && matrix.python_arch == 'arm64'
      - name: Install OpenSSL build dependency for Windows ARM64
        if: runner.os == 'Windows' && matrix.python_arch == 'arm64'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is missing on this Windows ARM64 runner."
          }
          vcpkg install openssl:arm64-windows
          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/arm64-windows"
          "OPENSSL_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$(Join-Path $opensslRoot 'include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$(Join-Path $opensslRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -e ".[dev]"
      - name: Compile all Python sources
        run: python -m compileall -q core interface security browser_extension scripts tests echocrypt.py
      - name: Validate browser manifests and build all extension archives
        run: |
          python -m json.tool browser_extension/manifest.json
          python -m json.tool browser_extension/firefox/manifest.json
          python scripts/build_browser_extensions.py --browser all --output dist/extensions
      - name: Validate JavaScript and browser contracts
        shell: bash
        run: |
          node --check browser_extension/service_worker.js
          node --check browser_extension/offscreen.js
          node --check browser_extension/pcm_worklet.js
          node --check browser_extension/firefox/background.js
          node --check browser_extension/firefox/content.js
          node --test tests/browser_extension_contract.test.cjs
      - name: Validate shell scripts
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/install_browser_tab_host.sh
          bash -n scripts/uninstall_browser_tab_host.sh
          sh -n scripts/echocrypt_tab_host
          bash -n scripts/bootstrap_linux.sh
      - name: Run pytest with application-wide branch coverage
        run: >-
          python -m pytest -q
          --cov-branch
          --cov=core
          --cov=security
          --cov=echocrypt_sdk
          --cov=interface
          --cov=browser_extension
          --cov=scripts
          --cov=echocrypt
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov
      - name: Upload application-wide coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}-py${{ matrix.python }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64, python_arch: "x64" }
          - { os: ubuntu-24.04-arm, target: linux-arm64, python_arch: "arm64" }
          - { os: windows-latest, target: windows-x64, python_arch: "x64" }
          - { os: windows-11-arm, target: windows-arm64, python_arch: "arm64" }
          - { os: macos-15, target: macos-arm64, python_arch: "arm64" }
          - { os: macos-15-intel, target: macos-x64, python_arch: "x64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}
      - uses: dtolnay/rust-toolchain@stable
        if: runner.os == 'Windows' && matrix.python_arch == 'arm64'
      - name: Install OpenSSL build dependency for Windows ARM64
        if: runner.os == 'Windows' && matrix.python_arch == 'arm64'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is missing on this Windows ARM64 runner."
          }
          vcpkg install openssl:arm64-windows
          $opensslRoot = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\arm64-windows"
          "OPENSSL_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$(Join-Path $opensslRoot 'include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$(Join-Path $opensslRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller sounddevice
      - uses: actions/setup-go@v7
        if: runner.os != 'macOS'
        with:
          go-version: stable
      - name: Install nFPM on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install nFPM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build standalone CLI and native messaging host
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT --collect-all sounddevice --add-data "config/default.toml;config" echocrypt.py
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT-NativeHost --collect-all sounddevice browser_extension/native_host.py
          else
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT --collect-all sounddevice --add-data "config/default.toml:config" echocrypt.py
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT-NativeHost --collect-all sounddevice browser_extension/native_host.py
          fi
      - name: Package browser extensions
        run: python scripts/build_browser_extensions.py --browser all --output dist/extensions
      - name: Assemble complete platform package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/scripts dist/package/docs
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/ECHOCRYPT.exe dist/package/
            cp dist/ECHOCRYPT-NativeHost.exe dist/package/
            cp scripts/install_browser_tab_host.ps1 dist/package/scripts/
          else
            cp dist/ECHOCRYPT dist/package/
            cp dist/ECHOCRYPT-NativeHost dist/package/
            cp scripts/install_browser_tab_host.sh scripts/uninstall_browser_tab_host.sh dist/package/scripts/
          fi
          cp -R dist/extensions dist/package/
          cp scripts/register_browser_host.py dist/package/scripts/
          cp docs/BROWSER_TAB_CAPTURE.md docs/VIRTUAL_AUDIO.md docs/PLATFORMS.md docs/INSTALLATION.md dist/package/docs/
          cp README.md CHANGELOG.md LICENSE dist/package/
          cp browser_extension/README.md dist/package/docs/BROWSER_EXTENSION_README.md
          printf '%s\n' "${{ matrix.target }}" > dist/package/PLATFORM.txt
      - name: Create unique platform archive
        run: >-
          python scripts/package_release.py archive
          --source dist/package
          --target "${{ matrix.target }}"
          --output-dir dist/release
      - name: Build native installable packages
        run: >-
          python scripts/build_installers.py
          --source dist/package
          --target "${{ matrix.target }}"
          --output-dir dist/release
      - uses: actions/upload-artifact@v7
        with:
          name: echocrypt-${{ matrix.target }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: [test, build]
    if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Choose Draft tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          [[ -n "$TAG" ]] || { echo "Release tag is empty."; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Determine previous release tag
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          TAG="${{ steps.tag.outputs.tag }}"
          PREVIOUS_TAG="$(git tag --merged "$GITHUB_SHA" --sort=-creatordate | awk -v current="$TAG" '$0 != current { print; exit }')"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
      - name: Generate GitHub release notes for changes since previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          PREVIOUS_TAG="${{ steps.previous.outputs.previous_tag }}"
          ARGS=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            ARGS+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq '.body' > release-assets/GITHUB_GENERATED_NOTES.md
          python scripts/generate_changelog.py \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --previous-tag "$PREVIOUS_TAG" \
            --generated-notes release-assets/GITHUB_GENERATED_NOTES.md \
            --output release-assets/RELEASE_NOTES.md
      - name: Validate platform archives and generate checksums
        run: |
          set -euo pipefail
          python scripts/package_release.py checksums --directory release-assets --output release-assets/SHA256SUMS
          python scripts/package_release.py validate --directory release-assets
      - name: Create or update verified Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"

          # Create the Git tag before asking gh to create a release. This avoids
          # GitHub's untagged placeholder release behavior when a tag is absent.
          git fetch --tags origin
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "ECHOCRYPT Draft release $TAG"
            git push origin "refs/tags/$TAG"
          fi

          TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Refusing release: tag $TAG points to $TAG_COMMIT, expected $GITHUB_SHA."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            EXISTING_TAG="$(gh release view "$TAG" --json tagName --jq '.tagName')"
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            [[ "$EXISTING_TAG" == "$TAG" ]] || { echo "Release tag mismatch."; exit 1; }
            [[ "$IS_DRAFT" == "true" ]] || {
              echo "Refusing to modify published release $TAG."
              exit 1
            }
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "ECHOCRYPT $TAG" \
              --notes-file release-assets/RELEASE_NOTES.md
          fi

          EXISTING_TAG="$(gh release view "$TAG" --json tagName --jq '.tagName')"
          IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          [[ "$EXISTING_TAG" == "$TAG" && "$IS_DRAFT" == "true" ]] || {
            echo "Release tag/state verification failed before upload."
            exit 1
          }

          mapfile -d '' RELEASE_ASSETS < <(
            find release-assets -type f \( \
              -name 'echocrypt-*.zip' -o -name 'echocrypt-*.deb' -o \
              -name 'echocrypt-*.rpm' -o -name 'echocrypt-*.msi' -o \
              -name 'echocrypt-*.pkg' -o -name 'SHA256SUMS' -o \
              -name 'RELEASE_NOTES.md' \
            \) -print0 | sort -z
          )
          EXPECTED_COUNT="$(python scripts/package_release.py expected | wc -l | tr -d ' ')"
          [[ "${#RELEASE_ASSETS[@]}" -eq "$EXPECTED_COUNT" ]] || {
            echo "Expected $EXPECTED_COUNT regular release files; found ${#RELEASE_ASSETS[@]}."
            exit 1
          }
          gh release upload "$TAG" "${RELEASE_ASSETS[@]}" --clobber
          gh release edit "$TAG" --draft --notes-file release-assets/RELEASE_NOTES.md

          FINAL_STATE="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          [[ "$FINAL_STATE" == "true" ]] || {
            echo "Release is no longer Draft; refusing to report success."
            exit 1
          }

          EXPECTED_NAMES="$(python scripts/package_release.py expected | sort)"
          ACTUAL_NAMES="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          [[ "$ACTUAL_NAMES" == "$EXPECTED_NAMES" ]] || {
            echo "Uploaded release asset set does not match the generated release manifest."
            printf 'Expected:\n%s\nActual:\n%s\n' "$EXPECTED_NAMES" "$ACTUAL_NAMES"
            exit 1
          }
