name: Cross-platform validation and draft release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.11" }
          - { os: macos-15, python: "3.11" }
          - { os: macos-15-intel, python: "3.11" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -m pip install -e ".[dev]"
      - name: Compile all Python sources
        run: python -m compileall -q core interface security browser_extension scripts tests
      - name: Validate manifests and build all browser packages
        run: |
          python -m json.tool browser_extension/manifest.json
          python -m json.tool browser_extension/firefox/manifest.json
          python scripts/build_browser_extensions.py --browser all --output dist/extensions
      - name: Validate JavaScript
        shell: bash
        run: |
          node --check browser_extension/service_worker.js
          node --check browser_extension/offscreen.js
          node --check browser_extension/pcm_worklet.js
          node --check browser_extension/firefox/background.js
          node --check browser_extension/firefox/content.js
      - name: Validate shell scripts
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/install_browser_tab_host.sh
          bash -n scripts/uninstall_browser_tab_host.sh
          sh -n scripts/echocrypt_tab_host
      - name: Run pytest suite with coverage
        run: python -m pytest -q --cov=core --cov=security --cov=echocrypt_sdk --cov-report=term-missing --cov-report=xml:coverage.xml

  build:
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller sounddevice
      - name: Build standalone CLI
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT --add-data "config/default.toml;config" echocrypt.py
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT-NativeHost browser_extension/native_host.py
          else
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT --add-data "config/default.toml:config" echocrypt.py
            pyinstaller --clean --noconfirm --onefile --name ECHOCRYPT-NativeHost browser_extension/native_host.py
          fi
      - name: Package browser extensions
        run: python scripts/build_browser_extensions.py --browser all --output dist/extensions
      - name: Assemble release package
        shell: bash
        run: |
          mkdir -p dist/package
          if [ "$RUNNER_OS" = "Windows" ]; then cp dist/ECHOCRYPT.exe dist/package/; else cp dist/ECHOCRYPT dist/package/; fi
          cp -R dist/extensions dist/package/
          if [ "$RUNNER_OS" = "Windows" ]; then cp dist/ECHOCRYPT-NativeHost.exe dist/package/; else cp dist/ECHOCRYPT-NativeHost dist/package/; fi
          cp README.md CHANGELOG.md LICENSE dist/package/
          echo "${{ matrix.target }}" > dist/package/PLATFORM.txt
      - uses: actions/upload-artifact@v7
        with:
          name: echocrypt-${{ matrix.target }}
          path: dist/package/
          if-no-files-found: error

  draft-release:
    needs: [test, build]
    if: ${{ needs.test.result == 'success' && needs.build.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Choose draft tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate complete release changelog
        run: python scripts/generate_changelog.py --ref "$GITHUB_SHA" --tag "${{ steps.tag.outputs.tag }}" --output release-assets/RELEASE_NOTES.md
      - name: Create or update Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Refusing to modify published release $TAG; this workflow only manages Draft releases."
              exit 1
            fi
          else
            gh release create "$TAG" --draft --title "ECHOCRYPT $TAG" --notes-file release-assets/RELEASE_NOTES.md
          fi
          gh release upload "$TAG" release-assets/RELEASE_NOTES.md release-assets/*/* --clobber
          gh release edit "$TAG" --draft --notes-file release-assets/RELEASE_NOTES.md
