name: Tests

on:
  # Android development branch: run tests on every push and on PRs to main.
  push:
    branches: [android]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # v2 separates this fixed workflow generation from any stale in-progress
  # runs left behind by the previous concurrency group.
  group: echocrypt-android-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Compile all Python sources
        run: python -m compileall -q core interface security browser_extension scripts tests echocrypt.py

      - name: Validate browser manifests and JavaScript
        run: |
          python -m json.tool browser_extension/manifest.json >/dev/null
          python -m json.tool browser_extension/firefox/manifest.json >/dev/null
          node --check browser_extension/service_worker.js
          node --check browser_extension/offscreen.js
          node --check browser_extension/pcm_worklet.js
          node --check browser_extension/firefox/background.js
          node --check browser_extension/firefox/content.js
          node --test tests/browser_extension_contract.test.cjs

      - name: Validate shell scripts
        run: |
          bash -n scripts/install_browser_tab_host.sh
          bash -n scripts/uninstall_browser_tab_host.sh
          bash -n scripts/bootstrap_linux.sh
          sh -n scripts/echocrypt_tab_host

      - name: Run full pytest suite with application-wide branch coverage
        run: >-
          python -m pytest -q
          --cov-branch
          --cov=core
          --cov=security
          --cov=echocrypt_sdk
          --cov=interface
          --cov=browser_extension
          --cov=scripts
          --cov=echocrypt
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-report=html:htmlcov

      - name: Upload application coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: application-coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  android-validation:
    name: Android native app validation
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Only this job needs release-write access. PR runs never publish releases.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests and assemble debug APK
        run: gradle -p android testDebugUnitTest assembleDebug

      - name: Prepare Android release assets
        if: github.event_name == 'push'
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/echocrypt-android-debug.apk
          cd dist
          sha256sum echocrypt-android-debug.apk > SHA256SUMS
          cat > RELEASE_NOTES.md <<'EOF'
          # ECHOCRYPT Android nightly

          This prerelease contains the standalone native Android debug APK built from the `android` development branch.

          ## Installation
          Download `echocrypt-android-debug.apk` and install it on an Android device. You may need to allow installation from the source used to download the APK.

          ## Build status and limitations
          - Built by GitHub Actions after the Android unit-test and debug-assembly steps passed.
          - This is an unsigned debug build, not a production-signed APK.
          - CI success does not establish successful operation on every Android device. Real-device microphone, speaker, and acoustic interoperability testing remains necessary.
          - Verify the downloaded APK against the accompanying `SHA256SUMS` file.
          EOF

      - name: Upload development APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: echocrypt-android-debug-apk
          path: |
            dist/echocrypt-android-debug.apk
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: Convert existing Android nightlies to drafts
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Android builds are experimental until protocol and device-level tests pass.
          # Keep all Android nightly releases private as drafts, including older published ones.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft \
            --jq '.[] | select(.tagName | startswith("android-nightly-")) | select(.isDraft == false) | .tagName' |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Converting $tag to draft"
            gh release edit "$tag" --draft --repo "$GITHUB_REPOSITORY"
          done

      - name: Create Android nightly GitHub Release as draft
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-nightly-$(date -u +'%Y%m%d')-${GITHUB_SHA::7}"
          title="ECHOCRYPT ${tag}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/echocrypt-android-debug.apk \
              dist/SHA256SUMS \
              dist/RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" --draft --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              dist/echocrypt-android-debug.apk \
              dist/SHA256SUMS \
              dist/RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file dist/RELEASE_NOTES.md \
              --draft \
              --prerelease
          fi
