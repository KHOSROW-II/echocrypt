name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install the developer package and pytest tooling
        run: python -m pip install -e ".[dev]"

      - name: Validate browser extension and native host scripts
        run: |
          python -m json.tool browser_extension/manifest.json >/dev/null
          node --check browser_extension/service_worker.js
          node --check browser_extension/offscreen.js
          node --check browser_extension/pcm_worklet.js
          bash -n scripts/install_browser_tab_host.sh
          bash -n scripts/uninstall_browser_tab_host.sh
          sh -n scripts/echocrypt_tab_host

      - name: Run pytest suite with coverage
        run: python -m pytest -q --cov=core --cov=security --cov=echocrypt_sdk --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage
          path: coverage.xml
          if-no-files-found: ignore
